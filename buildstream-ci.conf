# BuildStream config used by CI (mounted at /src inside the bst2 container).
# x86_64_v3 and gaming are project defaults in project.conf — do not pass them
# via BST_FLAGS here. The multi-runner reusable workflow (tuna-os/bst-ci)
# relies on these defaults because its planning job calls `bst show` directly
# without going through the Justfile wrapper.
scheduler:
  on-error: continue
  fetchers: 12
  builders: 1
  network-retries: 3
logging:
  message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
  error-lines: 80
build:
  max-jobs: 0
  retry-failed: True
cache:
  cache-buildtrees: never
