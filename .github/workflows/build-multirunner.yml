name: Build Yutyrannus NVIDIA

# Single-runner BuildStream build with a rolling GHCR-backed CAS cache.
#
# Each run restores the previous CAS snapshot, builds the target with a
# bounded budget, and pushes the (possibly partial) CAS back — so the build
# converges over successive runs instead of needing ~1150 elements to fit in
# one 6-hour job. Hitting the budget is an expected checkpoint (green with a
# warning); only genuine build errors fail the rolling builder.
# build_final (export, sign, push) stays in this file so cosign's keyless OIDC
# identity is unchanged.
#
# Nightly schedule + manual dispatch. Pushing more often would restart
# convergence from the latest HEAD each time; `validate.yml` remains the
# push-time feedback loop.

on:
  schedule:
    # Daily at 00:30 UTC — adjust as needed.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true
      build_aarch64:
        description: 'Also build an aarch64 image (experimental, manual-only)'
        type: boolean
        default: false

env:
  IMAGE_NAME: yutyrannus-nvidia
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/yutyrannus-nvidia.bst
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue instead of cancel: the next run picks up the latest HEAD when its
  # turn comes, rather than restarting from scratch on every intervening push.
  cancel-in-progress: false

jobs:
  # ── Debug: expose bst show stderr ──────────────────────────────────────
  debug_bst_show:
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: podman pull "$BST2_IMAGE"
      - run: |
          mkdir -p .cache/buildstream logs
          podman run --rm --privileged --device /dev/fuse \
            --security-opt apparmor=unconfined --cap-add SYS_ADMIN \
            -v "${{ github.workspace }}:/src:rw" \
            -v "${{ github.workspace }}/.cache/buildstream:/root/.cache/buildstream:rw" \
            -w /src \
            "$BST2_IMAGE" \
            bash -c '
              set -x
              echo "=== Test: oci/yutyrannus-nvidia.bst (planning-equivalent) ==="
              bst show --deps all --order stage --format "%{name}||%{state}||%{full-key}" oci/yutyrannus-nvidia.bst > /tmp/bst-show-debug.out 2>&1
              echo "TEST_EXIT=$?"
              echo "=== Last 100 lines ==="
              tail -100 /tmp/bst-show-debug.out
              echo "=== Error context ==="
              grep -B 5 -A 5 "ERROR\|Exception\|Traceback\|FAIL" /tmp/bst-show-debug.out | tail -50
            ' \
            > logs/bst-show-debug.log 2>&1 || true
      - run: |
          echo "=== Test results ==="
          grep "TEST_EXIT=" logs/bst-show-debug.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bst-show-debug
          path: logs/bst-show-debug.log
          retention-days: 7

  # ── Rolling builder: converges the CAS cache toward a complete build ──
  build_rolling:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7
      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rolling CAS from GHCR
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-rolling:latest"
          LEGACY_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-core:latest"
          TARBALL=""
          if oras pull "$ROLLING_REF" -o .; then
            TARBALL="cas-rolling.tar.zst"
          elif oras pull "$LEGACY_REF" -o .; then
            # One-time migration: the first rolling run inherits the legacy
            # multi-runner core cache instead of starting cold.
            echo "No rolling cache yet, seeding from legacy core cache."
            TARBALL="cas-core.tar.zst"
          else
            echo "No existing CAS cache, starting fresh."
          fi
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            zstd -d -c -T0 "$TARBALL" | tar -xf - -C "$HOME/.cache/buildstream"
            rm -f "$TARBALL"
          fi
          du -sh ~/.cache/buildstream

      - name: Build Target (bounded budget)
        id: build
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          # Bounded well inside the job timeout so the CAS push below always
          # runs — a job-level timeout cancels the job and throws away hours
          # of work. Hitting the budget is the expected steady state while
          # converging: the partial CAS is pushed below and the next run
          # resumes from it. Only the budget timeout is softened — a genuine
          # build error keeps its non-zero exit code.
          rc=0
          timeout 300m just bst --log-file /src/logs/build-rolling.log build "$BST_TARGET" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::rolling build hit the 300m budget — partial CAS is pushed below and the next run resumes from it"
            rc=0
          fi
          exit $rc

      - name: Push Rolling CAS to GHCR
        # Never push when the build step was skipped (e.g. restore failed):
        # that would clobber the good tag with an empty snapshot. A failed
        # build still pushes — its partial progress is worth saving.
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != 'cancelled'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-rolling:latest"
          podman run --rm \
            -v "$HOME/.cache/buildstream:/input:ro" \
            -v "${{ github.workspace }}:/output:rw" \
            "$BST2_IMAGE" \
            sh -c "tar -cf - -C /input --exclude 'cas/staging' --exclude 'cas/tmp' . | zstd -T0 > /output/cas-rolling.tar.zst"
          oras push "$ROLLING_REF" cas-rolling.tar.zst:application/vnd.buildstream.cas.tar.zst

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs-${{ env.IMAGE_NAME }}-rolling
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Final assembly + push ─────────────────────────────────────────────
  build_final:
    needs: build_rolling
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
      security-events: write # Trivy SARIF upload
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Checkout chunkah
        uses: actions/checkout@v7
        with:
          repository: coreos/chunkah
          path: chunkah

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rolling CAS from GHCR
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-rolling:latest"
          LEGACY_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-core:latest"
          TARBALL=""
          if oras pull "$ROLLING_REF" -o .; then
            TARBALL="cas-rolling.tar.zst"
          elif oras pull "$LEGACY_REF" -o .; then
            echo "No rolling cache yet, seeding from legacy core cache."
            TARBALL="cas-core.tar.zst"
          else
            echo "No existing CAS cache, starting fresh."
          fi
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            zstd -d -c -T0 "$TARBALL" | tar -xf - -C "$HOME/.cache/buildstream"
            rm -f "$TARBALL"
          fi
          du -sh ~/.cache/buildstream

      - name: Build Final Target
        id: build
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build "$BST_TARGET"

      - name: Salvage and Push Rolling CAS to GHCR
        # Final gets its own 300m of build on top of the rolling builder's,
        # so bank it even on timeout — same skip-guard as above.
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != 'cancelled'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-rolling:latest"
          podman run --rm \
            -v "$HOME/.cache/buildstream:/input:ro" \
            -v "${{ github.workspace }}:/output:rw" \
            "$BST2_IMAGE" \
            sh -c "tar -cf - -C /input --exclude 'cas/staging' --exclude 'cas/tmp' . | zstd -T0 > /output/cas-rolling.tar.zst"
          oras push "$ROLLING_REF" cas-rolling.tar.zst:application/vnd.buildstream.cas.tar.zst

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-logs-${{ env.IMAGE_NAME }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # Channels: main = nightly trunk (also owns :latest); stable = release bookmark
          if [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            TAGS="stable stable-${DATE_TAG} ${{ github.sha }}"
          else
            TAGS="latest nightly nightly-${DATE_TAG} ${{ github.sha }}"
          fi
          for tag in $TAGS; do
            sudo podman tag "localhost/${{ steps.export.outputs.image_ref }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            for i in 1 2 3; do
              sudo podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}" && break
              echo "Retry $i..."; sleep 5
            done
          done
          digest=$(sudo podman inspect "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --format '{{.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (cosign keyless)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY

  # ── Experimental aarch64 path ───────────────────────────────────────
  # Manual-dispatch only (build_aarch64 input, default false) — never runs
  # on the nightly schedule. Pushes exclusively to -aarch64-suffixed tags
  # (latest-aarch64, nightly-aarch64, etc.) — it can never overwrite
  # :latest/:nightly/:stable.
  build_rolling_aarch64:
    if: github.event_name == 'workflow_dispatch' && inputs.build_aarch64 == true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      ARCH_SUFFIX: -aarch64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7
      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rolling CAS from GHCR
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-rolling:latest"
          LEGACY_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-core:latest"
          TARBALL=""
          if oras pull "$ROLLING_REF" -o .; then
            TARBALL="cas-rolling.tar.zst"
          elif oras pull "$LEGACY_REF" -o .; then
            echo "No rolling cache yet, seeding from legacy core cache."
            TARBALL="cas-core.tar.zst"
          else
            echo "No existing CAS cache, starting fresh."
          fi
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            zstd -d -c -T0 "$TARBALL" | tar -xf - -C "$HOME/.cache/buildstream"
            rm -f "$TARBALL"
          fi
          du -sh ~/.cache/buildstream

      - name: Build Target (bounded budget)
        id: build
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          rc=0
          timeout 300m just bst --log-file /src/logs/build-rolling.log build "$BST_TARGET" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::rolling build hit the 300m budget — partial CAS is pushed below and the next run resumes from it"
            rc=0
          fi
          exit $rc

      - name: Push Rolling CAS to GHCR
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != 'cancelled'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-rolling:latest"
          podman run --rm \
            -v "$HOME/.cache/buildstream:/input:ro" \
            -v "${{ github.workspace }}:/output:rw" \
            "$BST2_IMAGE" \
            sh -c "tar -cf - -C /input --exclude 'cas/staging' --exclude 'cas/tmp' . | zstd -T0 > /output/cas-rolling.tar.zst"
          oras push "$ROLLING_REF" cas-rolling.tar.zst:application/vnd.buildstream.cas.tar.zst

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs-${{ env.IMAGE_NAME }}${{ env.ARCH_SUFFIX }}-rolling
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  build_final_aarch64:
    needs: build_rolling_aarch64
    if: needs.build_rolling_aarch64.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    env:
      ARCH_SUFFIX: -aarch64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Checkout chunkah
        uses: actions/checkout@v7
        with:
          repository: coreos/chunkah
          path: chunkah

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rolling CAS from GHCR
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-rolling:latest"
          LEGACY_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-core:latest"
          TARBALL=""
          if oras pull "$ROLLING_REF" -o .; then
            TARBALL="cas-rolling.tar.zst"
          elif oras pull "$LEGACY_REF" -o .; then
            echo "No rolling cache yet, seeding from legacy core cache."
            TARBALL="cas-core.tar.zst"
          else
            echo "No existing CAS cache, starting fresh."
          fi
          if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
            zstd -d -c -T0 "$TARBALL" | tar -xf - -C "$HOME/.cache/buildstream"
            rm -f "$TARBALL"
          fi
          du -sh ~/.cache/buildstream

      - name: Build Final Target
        id: build
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build "$BST_TARGET"

      - name: Salvage and Push Rolling CAS to GHCR
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != 'cancelled'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ROLLING_REF="ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-rolling:latest"
          podman run --rm \
            -v "$HOME/.cache/buildstream:/input:ro" \
            -v "${{ github.workspace }}:/output:rw" \
            "$BST2_IMAGE" \
            sh -c "tar -cf - -C /input --exclude 'cas/staging' --exclude 'cas/tmp' . | zstd -T0 > /output/cas-rolling.tar.zst"
          oras push "$ROLLING_REF" cas-rolling.tar.zst:application/vnd.buildstream.cas.tar.zst

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest-aarch64
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest-aarch64" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-logs-${{ env.IMAGE_NAME }}-aarch64
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # -aarch64-suffixed only — never the bare channel tags
          if [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            TAGS="stable-aarch64 stable-${DATE_TAG}-aarch64 ${{ github.sha }}-aarch64"
          else
            TAGS="latest-aarch64 nightly-aarch64 nightly-${DATE_TAG}-aarch64 ${{ github.sha }}-aarch64"
          fi
          for tag in $TAGS; do
            sudo podman tag "localhost/${{ steps.export.outputs.image_ref }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            for i in 1 2 3; do
              sudo podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}" && break
              echo "Retry $i..."; sleep 5
            done
          done
          digest=$(sudo podman inspect "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-aarch64" \
            --format '{{.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (cosign keyless)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary (aarch64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-aarch64\`" >> $GITHUB_STEP_SUMMARY
